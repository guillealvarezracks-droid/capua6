<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel interno de reservas · Capua 6</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN: misma convención que la web pública, sin añadir build tools -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons CDN: misma librería que la web pública -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS (build UMD desde CDN, sin bundler): expone window.supabase.createClient -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <link rel="stylesheet" href="panel.css">
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans">

  <!-- Pantalla de acceso: visible solo mientras no hay sesión iniciada -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <form id="form-login" class="w-full max-w-sm panel-form panel-card">
      <h1 class="font-bold text-lg leading-tight mb-0.5">Panel de reservas</h1>
      <p class="text-xs text-neutral-500 mb-4">Capua 6 — acceso interno</p>
      <div id="login-error" class="panel-errores hidden"></div>
      <label class="panel-label">Email
        <input required type="email" name="email" class="panel-input" autocomplete="username">
      </label>
      <label class="panel-label">Contraseña
        <input required type="password" name="password" class="panel-input" autocomplete="current-password">
      </label>
      <button type="submit" class="panel-btn panel-btn-primary w-full mt-1">Entrar</button>
    </form>
  </div>

  <!-- Contenido del panel: oculto hasta que se confirma la sesión -->
  <div id="app-shell" class="hidden">
    <header class="border-b border-neutral-800 px-4 py-3 sticky top-0 bg-neutral-950/95 backdrop-blur z-30">
      <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
        <div>
          <h1 class="font-bold text-lg leading-tight">Panel de reservas</h1>
          <p class="text-xs text-neutral-500 leading-tight" id="user-email"></p>
        </div>
        <button type="button" id="btn-logout" class="panel-btn panel-btn-outline text-xs !py-1.5 !px-2.5">
          Cerrar sesión
        </button>
      </div>
    </header>

    <nav class="max-w-3xl mx-auto px-4 pt-3 flex gap-1 border-b border-neutral-800" aria-label="Secciones del panel">
      <button type="button" class="panel-tab is-active" data-tab="agenda">Agenda</button>
      <button type="button" class="panel-tab" data-tab="calendario">Calendario</button>
      <button type="button" class="panel-tab" data-tab="bloqueos">Bloqueos</button>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-4 pb-28">
      <div id="tab-content"></div>
    </main>

    <button type="button" id="btn-nueva-reserva" class="panel-fab" aria-label="Nueva consulta o reserva">
      <i data-lucide="plus" class="w-6 h-6"></i>
    </button>
  </div>

  <!-- Contenedor genérico de modales (formularios, fichas, bloqueos) -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden bg-black/70 overflow-y-auto">
    <div id="modal-content" class="min-h-full sm:min-h-0 sm:max-w-lg sm:mx-auto sm:my-10"></div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    window.addEventListener('load', () => { if (window.lucide) window.lucide.createIcons(); });
  </script>
</body>
</html>
